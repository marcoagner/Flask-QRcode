[build-system]
requires = ["uv_build>=0.9.0,<0.13.0"]
build-backend = "uv_build"

[project]
name = "Flask-QRcode"
version = "3.1.0"
description = "A concise Flask extension to render QR codes on Jinja2 templates using python-qrcode"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["COPYING"]
authors = [{ name = "Marco Agner", email = "marco@agner.io" }]
requires-python = ">=3.7"
dependencies = [
    "Flask>=2.2.5,<3.0; python_version < '3.9'",
    "Flask>=3.1.3; python_version >= '3.9'",
    "qrcode>=6.1,<7.4",
    "Pillow>=9.1.0",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[dependency-groups]
dev = [
    "pytest>=4.6.6",
    "Sphinx>=5.3,<10",
    "Flask-Sphinx-Themes==1.0.2",
]

[tool.uv.build-backend]
module-name = "flask_qrcode"
module-root = ""

[tool.uv]
fork-strategy = "requires-python"
